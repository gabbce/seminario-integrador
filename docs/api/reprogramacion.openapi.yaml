openapi: 3.1.0
info:
  title: I-04.4 Reprogramar clases
  version: 1.0.0
  description: |
    Solo Admin/Bedel activos. Selección explícita de IDs de detalles y versión de reserva.
    Preparación coherente sin escritura devuelve comparación anterior/nueva, origen y aula fija,
    versión del calendario y de cada aula. Confirmación exige esas versiones revisadas y UUID.
    Todos los detalles seleccionados deben seguir vigentes y no iniciados; la nueva fecha/inicio
    debe ser futura, lunes a viernes, sin feriado, del mismo año habilitado, 07–23 y módulos de30min.
    Periódicas dentro de sus períodos asignados; esporádicas permiten receso. No se repiten fechas
    vigentes de la misma reserva. Revalida requisitos, ocupación externa y entre clases propuestas.
    Conserva aula e id_patron y no modifica patrón semanal. V13 permite fecha_original esporádica,
    la fija al primer cambio y protege el origen ya existente frente a cambios sucesivos.
    Orden de bloqueos control_cuentas → año → aulas ascendentes → reserva; reloj después de esperar.
    Guarda fechas/horarios/origen, versión, auditoría y resultado V11 juntos. Usa exclusión V12
    diferida para mover el conjunto y fuerza IMMEDIATE antes de registrar resultado.
    Reintento recupera resultado original antes de validar tiempo/versiones pero después del rol actual.
    UI conserva UUID/cuerpo/revisión ante incertidumbre incluso tras recarga; recuperación común
    GET /api/reservas/mutaciones/{operationId}. found=false no demuestra rechazo.
servers: [{url: /api}]
security: [{bearerAuth: []}]
paths:
  /reservas/{id}/reprogramacion/preparacion:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      summary: Revisar el conjunto completo conservando aula y origen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Request'}
      responses:
        '200':
          description: Revisión; no retiene espacios ni escribe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '400': {description: Selección/fecha/horario inválidos}
        '403': {description: Cuenta sin permiso vigente}
        '404': {description: Reserva inexistente}
        '409': {description: Inicio, cancelación, período, feriado, requisitos, versión o conflicto}
  /reservas/{id}/reprogramacion/confirmacion:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      summary: Confirmación completa con versiones revisadas y UUID
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Request'}
      responses:
        '200':
          description: Resultado original inmutable; consultar detalle actual por separado
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Review'}
                  - type: object
                    required: [operationId, at]
                    properties:
                      operationId: {type: string, format: uuid}
                      at: {type: string, format: date-time}
        '400': {description: Cuerpo o versiones revisadas incompletos}
        '403': {description: Cuenta sin permiso vigente}
        '404': {description: Reserva inexistente}
        '409': {description: Revisión desactualizada, tiempo, conflicto o UUID con contenido distinto; rollback}
        '503': {description: Resultado incierto; conservar UUID y cuerpo}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
  schemas:
    Versions:
      type: object
      properties:
        calendarVersion: {type: integer, minimum: 0, description: Obligatorio en confirmación}
        roomVersions:
          type: object
          additionalProperties: {type: integer, minimum: 0}
          description: Mapa ID interno de aula a versión; obligatorio en confirmación
    Request:
      allOf:
        - {$ref: '#/components/schemas/Versions'}
        - type: object
          required: [version, dates]
          properties:
            operationId: {type: string, format: uuid, description: Obligatorio en confirmación}
            version: {type: integer, minimum: 0}
            dates:
              type: array
              minItems: 1
              items:
                type: object
                required: [detailId, date, start, modules]
                properties:
                  detailId: {type: string}
                  date: {type: string, format: date}
                  start: {type: string, pattern: '^(0[7-9]|1[0-9]|2[0-2]):(00|30)$'}
                  modules: {type: integer, minimum: 1, maximum: 32}
    Slot:
      type: object
      required: [date, start, end]
      properties:
        date: {type: string, format: date}
        start: {type: string}
        end: {type: string}
    Review:
      allOf:
        - {$ref: '#/components/schemas/Versions'}
        - type: object
          required: [reservationId, version, calendarVersion, roomVersions, changes]
          properties:
            reservationId: {type: string}
            version: {type: integer}
            changes:
              type: array
              items:
                type: object
                required: [id, room, originalDate, before, after]
                properties:
                  id: {type: string}
                  room: {type: string}
                  originalDate: {type: string, format: date}
                  before: {$ref: '#/components/schemas/Slot'}
                  after: {$ref: '#/components/schemas/Slot'}
