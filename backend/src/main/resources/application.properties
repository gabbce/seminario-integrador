spring.application.name=Aulas
server.address=127.0.0.1
server.port=${PORT:8080}
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health

# Local Java-properties file, never versioned. Environment variables also work.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${AULAS_DB_URL}
spring.datasource.username=${AULAS_DB_USERNAME}
spring.datasource.password=${AULAS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.schema=aulas
spring.flyway.default-schema=aulas
spring.flyway.schemas=aulas
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=aulas
spring.jpa.open-in-view=false
management.endpoint.health.show-details=never

# Public issuer/JWKS only. No administrative key is used to validate sessions.
aulas.auth.issuer=${AULAS_SUPABASE_URL:https://nrjykdzvzrcixapkdfsp.supabase.co}/auth/v1
aulas.auth.jwks=${aulas.auth.issuer}/.well-known/jwks.json
