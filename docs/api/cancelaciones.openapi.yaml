openapi: 3.1.0
info:
  title: Cancelación atómica de clases
  version: I-04.2
security:
  - bearerAuth: []
paths:
  /api/reservas/{id}/cancelaciones/preparacion:
    parameters:
      - $ref: '#/components/parameters/reservation'
    post:
      summary: Revisar clases explícitas sin escritura, solo Admin/Bedel
      description: Valida versión, motivo y que todas sean futuras vigentes. Devuelve fechas, horarios, aulas, cantidad y si cesará la continuidad periódica. Consulta coherente, sin retener espacios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Proposal'
      responses:
        '200':
          description: Revisión del conjunto completo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Selección vacía/duplicada, IDs inválidos o motivo vacío/mayor a 1000 caracteres
        '403':
          description: Cuenta no operativa o inactiva
        '404':
          description: Reserva inexistente
        '409':
          description: Versión obsoleta o alguna clase ajena, iniciada o cancelada
  /api/reservas/{id}/cancelaciones/confirmacion:
    parameters:
      - $ref: '#/components/parameters/reservation'
    post:
      summary: Cancelar conjunto completo con motivo y operación recuperable
      description: >-
        El cuerpo contiene la propuesta revisada y un UUID. Bloqueos en orden control_cuentas,
        año, aulas ascendentes y reserva. Revalida permisos, versión y tiempo tras bloqueos.
        Cancela detalles conservando motivo/actor/instante, deriva estado de cabecera y aumenta versión.
        Si elimina toda continuidad futura de una periódica registra cese explícito; el fin natural no lo hace.
        Auditoría, resultado de operación y cambios se guardan juntos. No requiere año habilitado para liberar ocupación.
        UUID por actor en registro de mutaciones distinto de altas V9; contenido normalizado (IDs ordenados/motivo recortado).
        Mismo UUID y contenido devuelve resultado original antes de validar tiempo/versión; contenido distinto rechaza.
        El resultado inmutable contiene operationId, reservationId, version resultante, detailIds, reason, at,
        continuityCancelled y state. No incluye contactos. No se devuelve una reserva histórica como si fuera actual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Proposal'
                - type: object
                  required: [operationId]
                  properties:
                    operationId: {type: string, format: uuid}
      responses:
        '200':
          description: Resultado confirmado o recuperado; consultar detalle actual por separado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: Cuerpo inválido
        '403':
          description: Permisos actuales insuficientes, incluso al recuperar
        '404':
          description: Reserva inexistente
        '409':
          description: Propuesta obsoleta o clave reutilizada con otro contenido; sin cambios parciales
  /api/reservas/mutaciones/{key}:
    get:
      summary: Recuperar mutación propia, solo Admin/Bedel actuales
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: '{found: true, result: resultado inmutable} o {found: false}. false no prueba rechazo de una petición en vuelo; reintentar mismo UUID y cuerpo.'
        '403':
          description: Cuenta inactiva o sin permiso operativo
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    reservation:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  schemas:
    Proposal:
      type: object
      required: [version, detailIds, reason]
      properties:
        version: {type: integer, minimum: 0}
        detailIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
        reason: {type: string, minLength: 1, maxLength: 1000}

    Review:
      type: object
      required: [reservationId, version, reason, classes, count, continuityCancelled]
      properties:
        reservationId: {type: string}
        version: {type: integer, format: int64}
        reason: {type: string}
        count: {type: integer, minimum: 1}
        continuityCancelled: {type: boolean}
        classes:
          type: array
          items:
            type: object
            required: [id, date, start, end, room]
            properties:
              id: {type: string}
              date: {type: string, format: date}
              start: {type: string}
              end: {type: string}
              room: {type: string, description: Identificador visible del aula}
    Result:
      type: object
      required: [operationId, reservationId, version, detailIds, reason, at, continuityCancelled, state]
      properties:
        operationId: {type: string, format: uuid}
        reservationId: {type: string}
        version: {type: integer, format: int64, description: Versión resultante de esta operación, no necesariamente la actual}
        detailIds: {type: array, items: {type: string}}
        reason: {type: string}
        at: {type: string, format: date-time}
        continuityCancelled: {type: boolean}
        state: {type: string, enum: [CONFIRMADA, CANCELADA]}
