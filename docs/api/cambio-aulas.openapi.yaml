openapi: 3.1.0
info:
  title: I-04.3b Cambio de aulas
  version: 1.0.0
  description: |
    Solo Admin/Bedel activos. Opciones y preparación son snapshots coherentes sin escritura.
    Opciones admite selectedGroupIds para calcular candidatas suponiendo que esos grupos
    se moverán juntos. Preparación/confirmación vuelven a validar el conjunto final completo.
    Esporádica permite seleccionar una o varias clases futuras con aula por clase.
    Periódica permite seleccionar uno o varios patrones; cada selección incluye exactamente
    todas sus futuras vigentes (pertenencia por id_patron, aun reprogramadas a otro día).
    Nunca se alteran iniciadas/canceladas ni fechas/horas/orígenes. Año habilitado obligatorio.
    Cada grupo lleva los IDs explícitos revisados; cambio temporal o versión exige nueva revisión.
    UUID por actor/tipo/reserva/cuerpo normalizado. Reintento confirmado devuelve resultado original
    antes de revalidar tiempo/versión, pero siempre después de verificar permisos actuales.
    Confirmación bloquea control_cuentas → año → aulas ascendentes (actuales y nuevas) → reserva.
    Revalida versión, requisitos, estado y versión de aulas, conjunto, tiempo y ocupación.
    Compara el conjunto propuesto contra ocupación externa y entre sus propias clases.
    V12 hace diferible la exclusión GiST para permitir intercambios de aulas en el conjunto;
    solo se difiere durante esta transacción y se fuerza su comprobación antes del resultado.
    Actualiza patrones y detalles, versión, auditoría y resultado juntos. Cualquier conflicto
    rechaza todo. Lectura histórica anterior/nuevo es solo operativa. Respuesta incierta conserva
    UUID/cuerpo/revisión en sessionStorage; GET /api/reservas/mutaciones/{operationId} recupera
    resultado por actor. found=false no prueba fracaso ni habilita generar otra clave.
servers: [{url: /api}]
security: [{bearerAuth: []}]
paths:
  /reservas/{id}/aulas/opciones:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      summary: Grupos elegibles y aulas compatibles disponibles para todas sus clases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 0}
                selectedGroupIds: {type: array, uniqueItems: true, items: {type: string}, description: Grupos marcados para cambiar juntos; permite evaluar intercambios}
      responses:
        '200':
          description: Snapshot de opciones; grupos sin candidatas se devuelven con lista vacía
          content:
            application/json:
              schema:
                type: object
                required: [reservationId, version, periodic, groups]
                properties:
                  reservationId: {type: string}
                  version: {type: integer}
                  periodic: {type: boolean}
                  groups:
                    type: array
                    items:
                      type: object
                      required: [groupId, label, detailIds, classes, availableRooms]
                      properties:
                        groupId: {type: string, description: Identificador opaco del patrón o detalle}
                        label: {type: string}
                        detailIds: {type: array, items: {type: string}}
                        classes: {type: array, items: {$ref: '#/components/schemas/Class'}}
                        availableRooms:
                          type: array
                          items:
                            type: object
                            required: [internalId, id, version, capacity]
                            properties:
                              internalId: {type: string}
                              id: {type: string}
                              version: {type: integer}
                              capacity: {type: integer}
        '400': {description: Versión o selección de grupos inválida}
        '403': {description: Cuenta sin permiso vigente}
        '404': {description: Reserva inexistente}
        '409': {description: Versión obsoleta, año no habilitado o ninguna clase futura vigente}
  /reservas/{id}/aulas/preparacion:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      summary: Revisar aulas anteriores/nuevas y conjunto completo, sin escritura
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Request'}
      responses:
        '200':
          description: Comparación explícita por clase
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '400': {description: Cuerpo incompleto o duplicados}
        '403': {description: Cuenta sin permiso vigente}
        '404': {description: Reserva o aula inexistente}
        '409': {description: Conflicto, requisitos, versión o conjunto desactualizado; sin cambios}
  /reservas/{id}/aulas/confirmacion:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      summary: Guardar todo el conjunto revisado con UUID obligatorio
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Request'}
      responses:
        '200':
          description: Resultado inmutable; consultar detalle actual por separado
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Review'}
                  - type: object
                    required: [operationId, at]
                    properties:
                      operationId: {type: string, format: uuid}
                      at: {type: string, format: date-time}
        '400': {description: Cuerpo incompleto/duplicados}
        '403': {description: Cuenta sin permiso vigente}
        '404': {description: Reserva o aula inexistente}
        '409': {description: Cambio concurrente, tiempo, requisitos, ocupación o UUID distinto; rollback completo}
        '503': {description: Resultado incierto; conservar UUID y cuerpo}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
  schemas:
    Request:
      type: object
      required: [version, selections]
      properties:
        operationId: {type: string, format: uuid, description: Obligatorio en confirmación}
        version: {type: integer, minimum: 0}
        selections:
          type: array
          minItems: 1
          items:
            type: object
            required: [groupId, detailIds, roomId, roomVersion]
            properties:
              groupId: {type: string}
              detailIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
              roomId: {type: string}
              roomVersion: {type: integer, minimum: 0}
    Class:
      type: object
      required: [id, date, start, end, room]
      properties:
        id: {type: string}
        date: {type: string, format: date}
        start: {type: string}
        end: {type: string}
        room: {type: string}
    Review:
      type: object
      required: [reservationId, version, changes]
      properties:
        reservationId: {type: string}
        version: {type: integer}
        changes:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/Class'}
              - type: object
                required: [groupId, newRoom]
                properties:
                  groupId: {type: string}
                  newRoom: {type: string}
