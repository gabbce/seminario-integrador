openapi: 3.1.0
info: {title: Indicadores persistentes, version: 1.0.0}
security: [{bearerAuth: []}]
paths:
  /api/indicadores/resumen:
    get:
      description: Solo Admin/Bedel. Snapshot REPEATABLE READ. Fechas institucionales inclusivas, día usando from=to; cuatrimestre mediante límites del calendario. Excluye detalles cancelados; fecha/aula efectivas. Numerador y denominador por módulos de media hora y tipo histórico al inicio. Denominador exige cobertura habilitada completa, incluso atravesando cambios de tipo; ningún redondeo de eventos. Años cerrados/preparación no excluyen fechas ni receso. Sin historia previa inferida. Si falta cobertura, occupancy=null; horas conocidas se devuelven y unknownCoverage=true. Cero denominador devuelve null. React redondea solo presentación.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: room, in: query, schema: {type: string}, description: Identificador visible, vacío todas}
        - {name: type, in: query, schema: {type: string, enum: ['', General, Multimedios, Laboratorio, Sin historia]}, description: Tipo al inicio del módulo, no tipo actual}
        - {name: location, in: query, schema: {type: string}, description: "Edificio actual del aula. DA-87"}
        - {name: floor, in: query, schema: {type: integer}, description: "Piso actual del aula. DA-87"}
        - {name: minCapacity, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Capacidad actual mínima, en personas. DA-87"}
        - {name: maxCapacity, in: query, schema: {type: integer, minimum: 0}, description: "Capacidad actual máxima; no menor que la mínima. DA-87"}
        - {name: resources, in: query, schema: {type: string}, description: "Recursos requeridos separados por coma: fans, air, projector, television, computer. Nunca cantidad de PC (DA-30). DA-87"}
      responses:
        '200':
          description: Cifras exactas de módulos; percentage sin redondeo, null si no puede calcularse. forecast indica rango con fechas futuras según reloj institucional.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Summary'}
        '400': {description: Rango o filtros inválidos}
        '401': {description: Sesión inválida}
        '403': {description: Docente o cuenta no habilitada}
        '503': {description: Fallo técnico; no interpretar como cero}
  /api/indicadores/serie:
    get:
      description: Solo Admin/Bedel. Resumen y curvas calculados en un único snapshot. Misma selección histórica por módulo que resumen. Día incluye32 franjas, máximos independientes y todas sus franjas, alumnos-hora. Semana incluye fechas elegibles con cero clases aun sin aulas habilitadas, excluye feriados/fuera de apertura; medias sin redondear, null si no hay fechas. Pico de curva promedio separado del mayor pico de fecha concreta. No cuenta personas únicas.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: view, in: query, schema: {type: string, enum: [day, week], default: day}, description: day exige from=to}
        - {name: room, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, enum: ['', General, Multimedios, Laboratorio, Sin historia]}}
        - {name: location, in: query, schema: {type: string}, description: "Edificio actual del aula. DA-87"}
        - {name: floor, in: query, schema: {type: integer}, description: "Piso actual del aula. DA-87"}
        - {name: minCapacity, in: query, schema: {type: integer, minimum: 0, default: 0}, description: "Capacidad actual mínima, en personas. DA-87"}
        - {name: maxCapacity, in: query, schema: {type: integer, minimum: 0}, description: "Capacidad actual máxima; no menor que la mínima. DA-87"}
        - {name: resources, in: query, schema: {type: string}, description: "Recursos requeridos separados por coma: fans, air, projector, television, computer. Nunca cantidad de PC (DA-30). DA-87"}
      responses:
        '200':
          description: Resumen y vista solicitada; la otra vista es null.
          content:
            application/json:
              schema:
                type: object
                required: [summary, daily, weekly, studentHours]
                properties:
                  summary: {$ref: '#/components/schemas/Summary'}
                  studentHours: {type: number}
                  daily: {oneOf: [{$ref: '#/components/schemas/Day'}, {type: 'null'}]}
                  weekly: {oneOf: [{$ref: '#/components/schemas/Week'}, {type: 'null'}]}
        '400': {description: Filtro/rango/vista inválidos}
        '401': {description: Sesión inválida}
        '403': {description: Permiso insuficiente}
        '503': {description: Fallo técnico, nunca cero}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Breakdown:
      type: object
      required: [label, hours, availableHours, classes]
      properties:
        label: {type: string}
        hours: {type: number}
        availableHours: {type: number}
        classes: {type: integer, description: Ocurrencias distintas que aportan al grupo; una ocurrencia atravesando tipos puede aportar a ambos grupos}
    Summary:
      type: object
      required: [from, to, room, type, hours, availableHours, occupancy, classes, unknownCoverage, eligible, forecast, demand, rooms]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        room: {type: string}
        type: {type: string}
        hours: {type: number}
        availableHours: {type: number}
        occupancy: {type: [number, 'null']}
        classes: {type: integer}
        unknownCoverage: {type: boolean}
        eligible: {type: boolean, description: Existe al menos una fecha de apertura en calendario registrado, aun sin aulas habilitadas}
        forecast: {type: boolean}
        demand: {type: array, items: {$ref: '#/components/schemas/Breakdown'}}
        rooms: {type: array, items: {$ref: '#/components/schemas/Breakdown'}}

    Slot:
      type: object
      required: [start, end, students, classes]
      properties:
        start: {type: string}
        end: {type: string}
        students: {type: [number, 'null']}
        classes: {type: [number, 'null']}
    Day:
      type: object
      required: [date, slots, peakStudents, peakClasses, peakStudentSlots, peakClassSlots, studentHours, classes]
      properties:
        date: {type: string, format: date}
        slots: {type: array, minItems: 32, maxItems: 32, items: {$ref: '#/components/schemas/Slot'}}
        peakStudents: {type: integer}
        peakClasses: {type: integer}
        peakStudentSlots: {type: array, items: {type: string}, description: Todas las franjas inicio–fin empatadas}
        peakClassSlots: {type: array, items: {type: string}}
        studentHours: {type: number}
        classes: {type: integer}
    Week:
      type: object
      required: [week, eligible, peakStudents, peakClasses]
      properties:
        eligible: {type: boolean}
        peakStudents: {type: [number, 'null'], description: Pico de curva promedio}
        peakClasses: {type: [number, 'null']}
        week:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            required: [day, dates, slots, studentHours, classes, peakStudents, peakClasses, peakDateStudents]
            properties:
              day: {type: integer, minimum: 1, maximum: 5}
              dates: {type: array, items: {type: string, format: date}, description: Fechas elegibles del denominador}
              slots: {type: array, items: {$ref: '#/components/schemas/Slot'}}
              studentHours: {type: [number, 'null'], description: Media diaria}
              classes: {type: [number, 'null'], description: Media de clases programadas por fecha}
              peakStudents: {type: [number, 'null'], description: Pico de curva promedio del día semanal}
              peakClasses: {type: [number, 'null']}
              peakDateStudents: {type: [number, 'null'], description: Máximo de una fecha concreta, distinto de promedio}
