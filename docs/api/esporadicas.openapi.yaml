openapi: 3.0.3
info:
  title: Reservas esporádicas I-04.1
  version: 1.0.0
  description: |
    Negocio exclusivo de Java. Preparar no escribe ni retiene aulas. Fechas concretas
    del mismo año habilitado, incluso receso; lunes a viernes 07–23, módulos de 30
    minutos, inicio futuro estricto y sin feriados. Una fila por fecha, al menos una.
    Quitar una fila antes de consultar excluye explícitamente esa fecha del conjunto.
    Las alternativas ocupadas son informativas, nunca seleccionables.
security: [{bearerAuth: []}]
paths:
  /api/reservas/esporadicas/preparacion:
    post:
      summary: Consultar disponibilidad por fecha, todos los roles activos
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Proposal'}
      responses:
        '200':
          description: Fechas y aulas disponibles ordenadas por capacidad e identificador
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preparation'}
        '400': {description: Fecha, horario, requisitos o curso inválidos}
        '401': {description: Sesión requerida}
        '403': {description: Cuenta inactiva}
        '404': {description: Año inexistente}
        '409': {description: Año no habilitado, feriado o fecha iniciada}
        '503': {description: Consulta fallida, no equivale a disponibilidad vacía}
  /api/reservas/esporadicas/confirmacion:
    post:
      summary: Confirmar todas las fechas o ninguna, solo Admin y Bedel
      description: |
        Bloqueos control_cuentas, año, aulas por ID ascendente, operación/reserva.
        Revalidar permisos actuales, calendario, aulas, requisitos, fechas y ocupación.
        UUID por actor en el registro de operaciones existente; contenido canónico
        prefijado por modalidad, recursos/fechas/selecciones ordenados. Un reintento
        idéntico devuelve la reserva previa antes de verificar ocupación; otro contenido
        con la misma clave devuelve 409. Resultado y auditoría comparten transacción.
        GET /api/reservas/operaciones/{key} recupera solo operaciones propias.
        Timeout/5xx es resultado incierto: conservar cuerpo y UUID, comprobar o repetir.
        found=false no demuestra rechazo. GET detalle/listado permite consultar el resultado.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Confirmation'}
      responses:
        '200':
          description: Reserva confirmada o recuperada, contactos omitidos para Docente
          content:
            application/json:
              schema: {$ref: 'reservas.openapi.yaml#/components/schemas/Booking'}
        '400': {description: Propuesta incompleta o selecciones no corresponden exactamente a las fechas}
        '401': {description: Sesión requerida}
        '403': {description: Rol/estado actual impide escritura}
        '404': {description: Año inexistente}
        '409': {description: Versiones, tiempo, requisitos u ocupación cambiados; sin guardado parcial}
        '503': {description: Resultado incierto; comprobar o repetir idénticamente}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Date:
      type: object
      required: [date, start, modules]
      properties:
        date: {type: string, format: date}
        start: {type: string, pattern: '^(0[7-9]|1[0-9]|2[0-2]):(00|30)$'}
        modules: {type: integer, minimum: 1, maximum: 32}
    Proposal:
      type: object
      required: [year, students, type, resources, dates]
      properties:
        year: {type: integer, minimum: 1, maximum: 9999}
        courseId: {type: string, pattern: '^[1-9][0-9]{0,17}$', description: Opcional solo para disponibilidad}
        students: {type: integer, minimum: 1}
        type: {type: string, enum: [General, Multimedios, Laboratorio]}
        board: {type: string, enum: ['', Tiza, Fibrón]}
        resources:
          type: array
          uniqueItems: true
          items: {type: string, enum: [fans, air, projector, television, computer]}
        dates:
          type: array
          minItems: 1
          maxItems: 366
          description: Fechas únicas del año, módulos dentro del horario institucional
          items: {$ref: '#/components/schemas/Date'}
    Preparation:
      type: object
      required: [year, calendarVersion, dates]
      properties:
        year: {type: integer}
        calendarVersion: {type: integer, format: int64}
        dates:
          type: array
          items:
            type: object
            required: [date, start, end, availableRooms, compatibleCount, alternatives]
            properties:
              date: {type: string, format: date}
              start: {type: string}
              end: {type: string}
              compatibleCount: {type: integer}
              availableRooms:
                type: array
                description: Mostrar tres inicialmente y permitir consultar todas
                items:
                  type: object
                  required: [internalId, id, version, type, capacity]
                  properties:
                    internalId: {type: string}
                    id: {type: string}
                    version: {type: integer, format: int64}
                    type: {type: string}
                    capacity: {type: integer}
              alternatives:
                type: array
                description: Solo sin disponibles; por minutos totales de solapamiento, capacidad e identificador. Contactos y registrador ausentes para Docente.
                items: {$ref: 'reservas.openapi.yaml#/components/schemas/Alternative'}
    Confirmation:
      type: object
      required: [operationId, proposal, teacherId, calendarVersion, selections]
      properties:
        operationId: {type: string, format: uuid}
        proposal:
          allOf:
            - {$ref: '#/components/schemas/Proposal'}
            - {required: [courseId]}
        teacherId: {type: string, description: ID del catálogo fijo}
        calendarVersion: {type: integer, format: int64, minimum: 0}
        selections:
          type: array
          minItems: 1
          maxItems: 366
          items:
            type: object
            required: [date, roomId, roomVersion]
            properties:
              date: {type: string, format: date}
              roomId: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
              roomVersion: {type: integer, format: int64, minimum: 0}
