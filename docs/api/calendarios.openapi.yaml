openapi: 3.1.0
info:
  title: Calendario base I-02.4
  version: 1.0.0
  description: |
    Consulta para Administrador, Bedel y Docente activos. Escrituras solo Administrador.
    Fechas institucionales America/Argentina/Cordoba. Cada mutación bloquea permisos y
    año, comprueba su versión y confirma auditoría junto con los datos. Cerrado no se reabre.
    La representación usa el shape CalendarConfig y agrega id interno estable separado del año.
    Cuatrimestres ausentes se representan ["", ""], incompletos se admiten en preparación.
    Quitar un cuatrimestre de un año habilitado exige enviar En preparación en el mismo PUT.
    El agregado no pierde IDs de cuatrimestres conservados. Fechas sin cambios conservan su ID interno.
    Con reservas persistidas, el PUT conserva guardias de dependencias y rechaza nuevas clases
    pendientes de generar. La UI usa revisión y confirmación atómica definidas en
    calendario-impacto.openapi.yaml (I-04.5), con recuperación por actor/UUID.
security:
  - bearerAuth: []
paths:
  /api/referencias/calendarios:
    get:
      summary: Listar calendarios por año ascendente
      responses:
        '503': {$ref: '#/components/responses/Error'}
        '200':
          description: Todos los años, incluidos cerrados
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CalendarConfig'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/referencias/calendarios/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Consultar un año por ID interno
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '200': {$ref: '#/components/responses/Calendar'}
        '404': {$ref: '#/components/responses/Error'}
  /api/administracion/calendarios:
    get:
      summary: Buscar años lectivos por año exacto y estado, solo Administrador
      description: |
        Orden ascendente por año. Página de base cero; una página fuera de rango
        o sin coincidencias devuelve items vacío con total y filtros sin cambios.
        No reemplaza la colección completa de /api/referencias/calendarios.
      parameters:
        - {name: year, in: query, schema: {type: integer, minimum: 1, maximum: 9999}}
        - {name: state, in: query, schema: {type: string, enum: ['', 'En preparación', Habilitado, Cerrado], default: ''}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Página de años lectivos
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, size]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CalendarConfig'}}
                  total: {type: integer, minimum: 0}
                  page: {type: integer, minimum: 0}
                  size: {type: integer, minimum: 1, maximum: 100}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      summary: Crear año en preparación sin períodos ni fechas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year: {type: integer, minimum: 1, maximum: 9999}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '201': {$ref: '#/components/responses/Calendar'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/administracion/calendarios/{id}/cuatrimestres:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Buscar cuatrimestres de un año por rango de fechas, solo Administrador
      description: |
        Devuelve períodos en orden de número cuyo intervalo se solapa con el rango,
        con extremos inclusivos. Sin fechas devuelve todos, incluidos incompletos;
        con from excluye períodos sin fin y con to excluye períodos sin inicio.
        Fechas ISO imposibles o no canónicas y rango invertido son inválidos (400).
        Lista vacía es válida. No hay estado independiente del cuatrimestre:
        year y state describen el año seleccionado, incluidos años cerrados.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: Cuatrimestres y contexto del año
          content:
            application/json:
              schema:
                type: object
                required: [year, state, items]
                properties:
                  year: {type: integer}
                  state: {type: string, enum: ['En preparación', Habilitado, Cerrado]}
                  items:
                    type: array
                    items:
                      type: object
                      required: [number, start, end]
                      properties:
                        number: {type: integer, enum: [1, 2]}
                        start: {type: string, description: 'Fecha ISO o cadena vacía si pendiente'}
                        end: {type: string, description: 'Fecha ISO o cadena vacía si pendiente'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/administracion/calendarios/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      summary: Guardar calendario completo con versión del año
      description: |
        Habilitado requiere ambos cuatrimestres completos, dentro del año, ordenados y sin solapamiento.
        No permite agregar/quitar fechas pasadas ni moverlas desde/hacia el pasado.
        Sí admite corregir descripción de una fecha pasada conservando la fecha.
        Todas las fechas requieren descripción y no admiten duplicados.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Edit'}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '200': {$ref: '#/components/responses/Calendar'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      summary: Eliminar año abierto sin cuatrimestres ni fechas no lectivas
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '204': {description: Año eliminado y evento conservado}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  schemas:
    Edit:
      type: object
      required: [version, year, state, terms, holidays, descriptions]
      properties:
        version: {type: integer, minimum: 0}
        year: {type: integer, minimum: 1, maximum: 9999}
        state: {type: string, enum: ['En preparación', Habilitado, Cerrado]}
        terms:
          type: object
          required: [first, second]
          additionalProperties: false
          properties:
            first: {$ref: '#/components/schemas/Range'}
            second: {$ref: '#/components/schemas/Range'}
        holidays:
          type: array
          uniqueItems: true
          items: {type: string, format: date}
        descriptions:
          type: object
          additionalProperties: {type: string, minLength: 1}
    Range:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: string
        description: Fecha ISO YYYY-MM-DD o cadena vacía para extremo pendiente
    CalendarConfig:
      allOf:
        - {$ref: '#/components/schemas/Edit'}
        - type: object
          required: [id]
          properties:
            id: {type: string, pattern: '^[0-9]+$'}
  responses:
    Calendar:
      description: Calendario persistido con versión vigente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CalendarConfig'}
    Error:
      description: Error de validación, permiso, inexistencia, versión o dependencia
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
